name: CI
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore TheHotelAPI.sln
      - run: dotnet build TheHotelAPI.sln --configuration Release --no-restore
      - run: dotnet test TheHotelAPI.sln --configuration Release --no-build
